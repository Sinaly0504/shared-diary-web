<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记详情 - 共享日记</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><h1>共享日记</h1></a>
        <div class="user-auth-links">
            </div>
    </header>

    <main class="content-area">
        <div class="page-toolbar">
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-annotations-checkbox" checked>
                <span class="slider"></span>
                <span class="label-text">显示批注</span>
            </label>
        </div>

        <div id="diary-detail-container" class="diary-detail-card">
            <h1 id="detail-title">正在加载...</h1>
            <div id="detail-meta"></div>
            <div id="detail-actions-container" class="card-actions"></div>
            <p id="detail-content"></p>
        </div>
        
        <div class="form-actions">
            <a href="index.html" class="nav-button secondary">返回首页</a>
            <a href="#" id="edit-link" class="nav-button secondary" style="display: none;">编辑日记</a>
            <button id="export-button" class="nav-button secondary">导出为图片</button>
            <button id="delete-button" class="nav-button">删除日记</button> 
        </div>

                <!-- 【重要】恢复完整的评论区结构 -->
        <div id="comments-section" class="comments-section">
            <h2>评论区</h2>

            <!-- 评论列表将由 JavaScript 动态插入到这里 -->
            <div id="comments-list">
                <p>正在加载评论...</p>
            </div>

            <!-- 评论表单 -->
            <form id="comment-form" class="comment-form" style="display: none;">
                <textarea id="comment-content" placeholder="发表你的看法..." required></textarea>
                <button type="submit" class="nav-button">发表评论</button>
            </form>
            
            <!-- 未登录时的提示 -->
            <p id="comment-login-prompt" style="display: block;">
                <a href="login.html">登录</a>后才能发表评论。
            </p>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 ShareDiary. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
