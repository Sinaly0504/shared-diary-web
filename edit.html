<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑日记 - 共享日记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><h1>共享日记</h1></a>
        <div class="user-auth-links">
            </div>
    </header>

    <main class="content-area">
        <form class="diary-form" id="edit-form">
            <div class="form-group">
                <label for="diary-title">标题</label>
                <input type="text" id="diary-title" name="diary-title" placeholder="给你的日记起个名字吧">
            </div>

            <div class="form-group">
                <label for="privacy-level">隐私设置</label>
                <select id="privacy-level" name="privacy-level">
                    <option value="private">私密日记 (仅自己可见)</option>
                    <option value="public">公开发布 (所有人可见)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="diary-content">内容</label>
                <textarea id="diary-content" name="diary-content" rows="15" placeholder="今天发生了什么..."></textarea>
            </div>
            <div class="form-actions">
                <a href="#" id="cancel-edit-link" class="nav-button secondary">取消</a>
                <button type="submit" class="nav-button">保存修改</button>
            </div>
        </form>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 ShareDiary. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
