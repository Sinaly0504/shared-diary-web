<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日记 - 共享日记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-link"><h1>共享日记</h1></a>
        <div class="user-auth-links">
            </div>
    </header>

    <main class="content-area">
        <h2 class="page-title">我的日记</h2>
        
        <div class="search-container">
            <form id="search-form" class="search-form">
                <input type="search" id="search-input" name="q" placeholder="在我的日记中搜索...">
                <button type="submit" class="nav-button">搜索</button>
            </form>
        </div>

        <div class="sort-container">
            <button class="sort-button active" data-sort="time">最新发布</button>
            <button class="sort-button" data-sort="likes">最热点赞</button>
        </div>

        <div id="diary-container" class="waterfall-container">
            </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 ShareDiary. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
