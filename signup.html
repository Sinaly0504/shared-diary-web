<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 共享日记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header class="main-header">
        <a href="index.html" class="logo-link"><h1>共享日记</h1></a>
        <div class="user-auth-links">
            <a href="signup.html">注册</a>
            <a href="#">登录</a>
        </div>
    </header>

    <main class="content-area">
        <form class="auth-form" id="signup-form">
            <h2>加入 共享日记</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入你的用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码 (至少6位)</label>
                <input type="password" id="password" name="password" placeholder="请输入你的密码" required minlength="6">
            </div>
            <div class="form-actions">
                <p class="auth-switch">已经有账户了？ <a href="login.html">立即登录</a></p>
                <button type="submit" class="nav-button">注册</button>
            </div>
        </form>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 ShareDiary. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
